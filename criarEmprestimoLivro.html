<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de empréstimos</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>Empréstimo de livros</h1>
    <form id="formEmprestimoLivro">
        <label>Titulo do Livro</label>
        <input type="text" id="titulo" name="titulo">
        <br><br>
        <label>Preço:</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" max="99999.99">
        <br><br>
        <label>ISBN:</label>
        <input type="text" id="isbn" name="isbn" step="0.01" min="0" max="99999.99">
        <br><br>
        <label>Data do empréstimo:</label>
        <input type="date" id="data_emprestimo" name="data_emprestimo">
        <br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <div id="message"></div>

    <script src="criarEmprestimoLivro.js"></script>
</body>

</html>
